<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Tempo is a quiet, focused piano practice studio.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tempo">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./app.css">
  <title>Tempo — Piano Studio</title>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" aria-label="Tempo">
      <a class="brand" href="#today" aria-label="Tempo home"><span class="brand-mark">T</span><span>Tempo</span></a>
      <nav class="desktop-nav" id="desktopNav" aria-label="Primary navigation"></nav>
      <p class="sync-state" id="syncState" role="status">Local studio</p>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div id="screen"></div>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation"></nav>
  </div>

  <section class="practice-layer" id="practiceLayer" hidden aria-label="Practice session">
    <div id="practiceScreen"></div>
  </section>

  <div class="dialog-backdrop" id="dialogBackdrop" hidden>
    <section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
